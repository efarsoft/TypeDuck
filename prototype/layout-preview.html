<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TypeDuck 排版鸭 · 布局原型 v3</title>
<style>
  :root {
    --green: #07c160;
    --green-dark: #06a050;
    --green-soft: #e8f9ef;
    --text: #1d2129;
    --text-2: #4e5969;
    --text-3: #86909c;
    --border: #e5e6eb;
    --bg: #f5f6f8;
    --panel: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ===== 顶栏 App Bar ===== */
  .appbar {
    height: 54px;
    flex: 0 0 54px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .logo {
    width: 26px; height: 26px; border-radius: 7px; background: var(--green);
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 15px; font-weight: 700; align-self: center;
  }
  .brand-name { font-size: 15px; font-weight: 600; letter-spacing: .3px; }
  .brand-slogan { font-size: 12px; color: var(--text-3); }
  .appbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  /* ===== 主体 ===== */
  .body { flex: 1; display: flex; min-height: 0; }

  /* 左侧边栏 */
  .sidebar {
    width: 212px; flex: 0 0 212px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 12px;
  }
  .sidebar h3 { font-size: 12px; color: var(--text-3); font-weight: 600; margin-bottom: 8px; }
  .search {
    height: 30px; border: 1px solid var(--border); border-radius: 7px;
    display: flex; align-items: center; padding: 0 8px; color: var(--text-3);
    font-size: 12px; margin-bottom: 8px; background: #fafbfc;
  }
  .btn-new {
    height: 32px; border: none; border-radius: 7px; background: var(--green);
    color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; margin-bottom: 10px;
    display: flex; align-items: center; justify-content: center; gap: 4px;
  }
  .btn-new:hover { background: var(--green-dark); }
  .doc-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .doc-item {
    padding: 8px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent;
  }
  .doc-item:hover { background: #f2f3f5; }
  .doc-item.active { background: var(--green-soft); border-color: #b9eccf; }
  .doc-title { font-size: 13px; font-weight: 500; }
  .doc-item.active .doc-title { color: var(--green-dark); }
  .doc-meta { font-size: 11px; color: var(--text-3); margin-top: 2px; }

  /* 主区 */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .subbar {
    height: 50px; flex: 0 0 50px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 14px; gap: 12px;
  }
  .title-input {
    height: 32px; border: 1px solid var(--border); border-radius: 7px;
    padding: 0 10px; font-size: 13px; width: 260px; color: var(--text);
  }
  .title-input:focus { outline: none; border-color: var(--green); }
  .save-state { font-size: 12px; color: var(--green); }
  .subbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .btn-copy {
    height: 32px; padding: 0 16px; border: none; border-radius: 7px;
    background: var(--green); color: #fff; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .btn-copy:hover { background: var(--green-dark); }
  .btn-pub {
    height: 32px; padding: 0 14px; border: 1px solid var(--green); border-radius: 7px;
    background: #fff; color: var(--green); font-size: 13px; font-weight: 500; cursor: pointer;
  }
  .btn-pub:hover { background: var(--green-soft); }
  .icon-btn {
    width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 7px;
    background: #fff; color: var(--text-2); cursor: pointer; display: inline-flex;
    align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: #f2f3f5; color: var(--text); }
  .icon-btn.active { background: var(--green-soft); color: var(--green); border-color: var(--green); }
  .icon-btn.active:hover { background: var(--green-soft); }

  /* 内容区 3 列 */
  .content { flex: 1; display: flex; min-height: 0; }
  .panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .panel-head {
    height: 40px; flex: 0 0 40px; display: flex; align-items: center;
    padding: 0 12px; gap: 10px; border-bottom: 1px solid var(--border); background: #fafbfc;
  }
  .panel-head .ph-title { font-size: 12px; font-weight: 600; color: var(--text-2); }
  .panel-editor { flex: 1.1; border-right: 1px solid var(--border); }
  .panel-preview { flex: 1.1; border-right: 1px solid var(--border); background: #f0f1f3; }
  .panel-right { flex: 0 0 300px; width: 300px; background: var(--panel); }

  /* 格式栏（编辑区内嵌） */
  .format-bar {
    display: flex; align-items: center; gap: 2px; padding: 6px 10px;
    border-bottom: 1px solid var(--border); background: #fff; flex-wrap: wrap;
  }
  .fbtn {
    width: 30px; height: 28px; border: none; background: transparent; border-radius: 6px;
    cursor: pointer; color: var(--text-2); font-size: 13px; display: inline-flex;
    align-items: center; justify-content: center;
  }
  .fbtn:hover { background: #eef0f2; color: var(--text); }
  .fsep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }

  .editor-area {
    flex: 1; border: none; resize: none; padding: 16px; font-size: 14px; line-height: 1.7;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; color: var(--text);
    outline: none;
  }

  /* 预览 */
  .preview-scroll { flex: 1; overflow-y: auto; padding: 18px; display: flex; justify-content: center; align-items: flex-start; }
  .preview-card {
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    width: 390px; max-width: 100%; padding: 22px 18px 32px; min-height: 200px;
    transition: width .25s ease;
  }
  .preview-card h1 { font-size: 20px; margin: 0 0 12px; }
  .preview-card h2 { font-size: 17px; margin: 16px 0 8px; }
  .preview-card p { margin: 8px 0; line-height: 1.8; }
  .preview-card blockquote { border-left: 3px solid #ddd; padding-left: 10px; color: var(--text-2); margin: 8px 0; }
  .preview-card pre { background: #f6f8fa; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12.5px; }
  .preview-card code { background: #f2f3f5; padding: 1px 4px; border-radius: 4px; font-size: 12.5px; }
  .preview-card ul, .preview-card ol { padding-left: 22px; margin: 8px 0; }
  .preview-card li { margin: 4px 0; }

  /* 宽度切换 */
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .seg button {
    border: none; background: #fff; padding: 4px 12px; font-size: 12px; cursor: pointer; color: var(--text-2);
  }
  .seg button.active { background: var(--green); color: #fff; }

  /* 右侧面板（无 tab，由 subbar 图标切换视图） */
  .tab-body { flex: 1; overflow-y: auto; padding: 12px; }
  .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .theme-card {
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden; cursor: pointer;
    background: #fff;
  }
  .theme-card.active { border-color: var(--green); box-shadow: 0 0 0 2px var(--green-soft); }
  .theme-swatch { height: 46px; }
  .theme-name { font-size: 11.5px; padding: 6px 8px; color: var(--text-2); }
  .placeholder { color: var(--text-3); font-size: 12px; text-align: center; padding: 40px 12px; line-height: 1.8; }

  /* 排版参数（合并进主题面板） */
  .setting-block { margin-top: 16px; border-top: 1px dashed var(--border); padding-top: 12px; }
  .setting-title { font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; }
  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 0; gap: 10px;
  }
  .setting-row label { font-size: 12px; color: var(--text-2); }
  .setting-row select {
    flex: 0 0 96px; height: 28px; border: 1px solid var(--border); border-radius: 6px;
    background: #fff; font-size: 12px; color: var(--text); padding: 0 6px;
  }

  /* 底部状态栏 */
  .statusbar {
    height: 30px; flex: 0 0 30px; background: var(--panel); border-top: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 14px; gap: 16px; font-size: 11.5px; color: var(--text-3);
  }
</style>
</head>
<body>
  <!-- 顶栏 -->
  <header class="appbar">
    <div class="brand">
      <span class="logo">鸭</span>
      <span class="brand-name">TypeDuck 排版鸭</span>
      <span class="brand-slogan">排版呀，交给我吧！</span>
    </div>
    <div class="appbar-right">
      <button class="btn-pub" id="btnPub">发布公众号</button>
      <button class="btn-copy" id="btnCopy">复制到公众号</button>
    </div>
  </header>

  <div class="body">
    <!-- 左侧边栏 -->
    <aside class="sidebar">
      <h3>文档列表</h3>
      <div class="search">搜索本地文档…</div>
      <button class="btn-new">＋ 新建文章</button>
      <div class="doc-list">
        <div class="doc-item active">
          <div class="doc-title">产品介绍</div>
          <div class="doc-meta">08-19 12:02 · 1,280 字</div>
        </div>
        <div class="doc-item">
          <div class="doc-title">排版说明</div>
          <div class="doc-meta">08-18 22:10 · 860 字</div>
        </div>
        <div class="doc-item">
          <div class="doc-title">开发教程</div>
          <div class="doc-meta">08-18 18:45 · 2,340 字</div>
        </div>
      </div>
    </aside>

    <!-- 主区 -->
    <main class="main">
      <!-- 子标题栏 -->
      <div class="subbar">
        <input class="title-input" value="产品介绍" />
        <span class="save-state">已保存</span>
        <div class="subbar-right">
          <button class="icon-btn" title="视图切换">▥</button>
          <button class="icon-btn" title="导出 HTML">⤓</button>
          <button class="icon-btn" id="btnHistory" title="历史版本">⏱</button>
          <button class="icon-btn active" id="btnTheme" title="主题样式">🎨</button>
        </div>
      </div>

      <!-- 内容 3 列 -->
      <div class="content">
        <!-- 编辑器面板 -->
        <section class="panel panel-editor">
          <div class="panel-head"><span class="ph-title">Markdown 内容</span></div>
          <div class="format-bar">
            <button class="fbtn" title="粗体" data-md="**"><b>B</b></button>
            <button class="fbtn" title="斜体" data-md="*"><i>I</i></button>
            <button class="fbtn" title="删除线" data-md="~~">S</button>
            <span class="fsep"></span>
            <button class="fbtn" title="引用" data-md="> ">❝</button>
            <button class="fbtn" title="行内代码" data-md="`">⟨⟩</button>
            <button class="fbtn" title="代码块" data-md="```">▤</button>
            <span class="fsep"></span>
            <button class="fbtn" title="无序列表" data-md="- ">•</button>
            <button class="fbtn" title="有序列表" data-md="1. ">1.</button>
            <span class="fsep"></span>
            <button class="fbtn" title="链接" data-md="[]()">🔗</button>
            <button class="fbtn" title="图片" data-md="![]()">🖼</button>
          </div>
          <textarea class="editor-area" id="editor"># 产品介绍

排版鸭是一款**本地优先、完全免费**的公众号 Markdown 排版工具。

## 核心特性

- 双栏实时预览
- 一键复制到公众号
- 15+ 精选排版主题

> 排版呀，交给我吧！

```js
console.log('hello typeduck')
```
</textarea>
        </section>

        <!-- 预览面板 -->
        <section class="panel panel-preview">
          <div class="panel-head">
            <span class="ph-title">预览</span>
            <div class="seg" style="margin-left:auto">
              <button class="active" data-w="390">手机</button>
              <button data-w="677">公众号</button>
            </div>
          </div>
          <div class="preview-scroll">
            <div class="preview-card" id="preview"></div>
          </div>
        </section>

        <!-- 右侧面板：默认主题样式，点 subbar 历史图标切换 -->
        <aside class="panel panel-right">
          <div class="panel-head">
            <span class="ph-title" id="rightTitle">主题样式</span>
          </div>
          <div class="tab-body" data-body="theme">
            <div class="theme-grid" id="themeGrid"></div>
            <div class="setting-block">
              <div class="setting-title">排版参数</div>
              <div class="setting-row">
                <label>正文字体</label>
                <select><option>跟随主题</option><option>微软雅黑</option><option>思源黑体</option><option>宋体</option></select>
              </div>
              <div class="setting-row">
                <label>正文字号</label>
                <select><option>15px</option><option>14px</option><option>16px</option><option>17px</option></select>
              </div>
              <div class="setting-row">
                <label>行间距</label>
                <select><option>1.8</option><option>1.6</option><option>2.0</option></select>
              </div>
              <div class="setting-row">
                <label>段间距</label>
                <select><option>1.2em</option><option>1.0em</option><option>1.5em</option></select>
              </div>
              <div class="setting-row">
                <label>字间距</label>
                <select><option>0</option><option>0.5px</option><option>1px</option></select>
              </div>
              <div class="setting-row">
                <label>图片圆角</label>
                <select><option>8px</option><option>0（直角）</option><option>16px</option></select>
              </div>
              <div class="setting-row">
                <label>代码块风格</label>
                <select><option>跟随主题</option><option>GitHub</option><option>Monokai</option><option>One Dark</option></select>
              </div>
              <div class="setting-row">
                <label>首行缩进</label>
                <select><option>关闭</option><option>2 字符</option></select>
              </div>
            </div>
          </div>
          <div class="tab-body placeholder" data-body="history" style="display:none">
            历史版本功能开发中<br/>（P4 规划）
          </div>
        </aside>
      </div>

      <!-- 底部状态栏 -->
      <footer class="statusbar">
        <span id="stWords">字数 1280</span>
        <span id="stLines">行数 18</span>
        <span id="stRead">预计阅读 4 分钟</span>
        <span style="margin-left:auto">本地优先 · MIT 开源</span>
      </footer>
    </main>
  </div>

<script>
  // ---- 极简 markdown 渲染 ----
  function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function inline(s){
    s = escapeHtml(s);
    s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
    s = s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
    return s;
  }
  function render(md){
    const lines = md.split('\n');
    let html='', i=0;
    while(i<lines.length){
      let l=lines[i];
      if(l.startsWith('# ')){html+=`<h1>${inline(l.slice(2))}</h1>`;i++;}
      else if(l.startsWith('## ')){html+=`<h2>${inline(l.slice(3))}</h2>`;i++;}
      else if(l.startsWith('> ')){html+=`<blockquote>${inline(l.slice(2))}</blockquote>`;i++;}
      else if(l.startsWith('```')){
        let code='';i++;
        while(i<lines.length&&!lines[i].startsWith('```')){code+=lines[i]+'\n';i++;}
        i++;
        html+=`<pre><code>${escapeHtml(code)}</code></pre>`;
      }
      else if(l.startsWith('- ')){
        let items='';
        while(i<lines.length&&lines[i].startsWith('- ')){items+=`<li>${inline(lines[i].slice(2))}</li>`;i++;}
        html+=`<ul>${items}</ul>`;
      }
      else if(/^\d+\. /.test(l)){
        let items='';
        while(i<lines.length&&/^\d+\. /.test(lines[i])){items+=`<li>${inline(lines[i].replace(/^\d+\. /,''))}</li>`;i++;}
        html+=`<ol>${items}</ol>`;
      }
      else if(l.trim()===''){i++;}
      else { html+=`<p>${inline(l)}</p>`; i++; }
    }
    return html;
  }

  const editor=document.getElementById('editor');
  const preview=document.getElementById('preview');
  function update(){
    preview.innerHTML=render(editor.value);
    const words=editor.value.replace(/\s/g,'').length;
    const lines=editor.value.split('\n').length;
    document.getElementById('stWords').textContent='字数 '+words;
    document.getElementById('stLines').textContent='行数 '+lines;
    document.getElementById('stRead').textContent='预计阅读 '+Math.max(1,Math.round(words/350))+' 分钟';
  }
  editor.addEventListener('input',update);
  update();

  // 格式栏插入
  document.querySelectorAll('.fbtn').forEach(b=>{
    b.addEventListener('click',()=>{
      const wrap=b.dataset.md;
      const s=editor.selectionStart,e=editor.selectionEnd,v=editor.value;
      const sel=v.slice(s,e);
      // 对成对符号做包裹，对行首符号做行首插入
      const pair={'**':1,'*':1,'~~':1,'`':1,'```':1};
      let insert;
      if(pair[wrap] && wrap!=='```' && wrap!=='> ' && !wrap.endsWith('. ')){
        insert=wrap+sel+wrap;
      } else {
        insert=wrap+sel;
      }
      editor.value=v.slice(0,s)+insert+v.slice(e);
      editor.focus();
      update();
    });
  });

  // 预览宽度切换
  document.querySelectorAll('.seg button').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      preview.style.width=b.dataset.w+'px';
    });
  });

  // 右侧面板：默认主题样式，由 subbar 图标切换视图（无 tab）

  // 主题网格
  const themes=[
    {name:'极简白',bg:'#ffffff',bar:'#f2f3f5'},
    {name:'极夜黑',bg:'#1e1e1e',bar:'#2b2b2b'},
    {name:'羊皮纸',bg:'#fbf4e6',bar:'#f3e9d2'},
    {name:'GitHub',bg:'#ffffff',bar:'#eef1f4'},
    {name:'薄荷绿',bg:'#f3fbf6',bar:'#e2f5ea'},
    {name:'杂志风',bg:'#fffdf7',bar:'#f6efe0'},
  ];
  const grid=document.getElementById('themeGrid');
  themes.forEach((th,idx)=>{
    const card=document.createElement('div');
    card.className='theme-card'+(idx===0?' active':'');
    card.innerHTML=`<div class="theme-swatch" style="background:${th.bg}"></div><div class="theme-name">${th.name}</div>`;
    card.addEventListener('click',()=>{
      document.querySelectorAll('.theme-card').forEach(c=>c.classList.remove('active'));
      card.classList.add('active');
      preview.style.background=th.bg;
    });
    grid.appendChild(card);
  });

  // 复制/发布（原型提示）
  document.getElementById('btnCopy').addEventListener('click',()=>alert('原型示意：复制内联样式到剪贴板'));
  document.getElementById('btnPub').addEventListener('click',()=>alert('原型示意：发布需配置认证服务号 API（P5）'));

  // 子标题栏图标 → 切换右侧面板 tab
  function switchTab(name){
    document.querySelectorAll('.tab-body').forEach(b=>{
      b.style.display=(b.dataset.body===name)?'block':'none';
    });
    const title=document.getElementById('rightTitle');
    if(title) title.textContent = (name==='history') ? '历史版本' : '主题样式';
    const bt=document.getElementById('btnTheme'), bh=document.getElementById('btnHistory');
    if(bt) bt.classList.toggle('active', name==='theme');
    if(bh) bh.classList.toggle('active', name==='history');
  }
  document.getElementById('btnTheme').addEventListener('click',()=>switchTab('theme'));
  document.getElementById('btnHistory').addEventListener('click',()=>switchTab('history'));
</script>
</body>
</html>
