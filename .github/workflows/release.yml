name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    name: Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Web（含品牌资产同步）
        run: pnpm build:web

      - name: 打包并发布 Draft Release
        run: pnpm --filter typeduck-desktop exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
