appId: cn.efarsoft.typeduck
productName: 排版鸭
# CI 打 tag 时自动发布到 GitHub Releases（草稿态，人工确认后 Publish）
publish:
  provider: github
  owner: efarsoft
  repo: TypeDuck
  releaseType: draft
directories:
  output: release
files:
  - src/**/*
  - package.json
extraResources:
  # 打包时把 Web 版构建产物一起带上（生产模式从 ../web/dist 加载）
  - from: ../web/dist
    to: web/dist
    filter: ['**/*']
win:
  target: nsis
  # 文件名用英文品牌名（中文文件名在部分下载器/浏览器会转码异常）；应用显示名仍是「排版鸭」
  artifactName: TypeDuck-${version}-${arch}-setup.${ext}
  # 未做代码签名：跳过签名与图标编辑，规避 winCodeSign 解压需要符号链接权限的问题
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 排版鸭
mac:
  target: dmg
  category: public.app-category.productivity
