appId: cn.efarsoft.typeduck
productName: 排版鸭
# CI 打 tag 时自动发布到 GitHub Releases（草稿态，人工确认后 Publish）
publish:
  provider: github
  owner: efarsoft
  repo: TypeDuck
  releaseType: draft
directories:
  output: release
# 打包完成后、制作安装器前执行（图标注入见 scripts/after-pack.js）
afterPack: scripts/after-pack.js
files:
  - src/**/*
  - package.json
extraResources:
  # 打包时把 Web 版构建产物一起带上（生产模式从 ../web/dist 加载）
  - from: ../web/dist
    to: web/dist
    filter: ['**/*']
win:
  target: nsis
  # 鸭子品牌图标（.ico 含多尺寸；安装器图标也会用这个）
  icon: build/icon.ico
  # 文件名用英文品牌名（中文文件名在部分下载器/浏览器会转码异常）；应用显示名仍是「排版鸭」
  artifactName: TypeDuck-${version}-${arch}-setup.${ext}
  # winCodeSign 工具包在本机解压失败（darwin 符号链接无权限），自动注入会中止构建；
  # 关闭后由 afterPack 钩子（scripts/after-pack.js）用内置 rcedit 手动注入图标
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 排版鸭
mac:
  target: dmg
  category: public.app-category.productivity
